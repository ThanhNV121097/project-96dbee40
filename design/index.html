<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hello World</title>
  <style>
    :root {
      --bg: #f8fafc;
      --panel: #ffffff;
      --text: #0f172a;
      --muted: #475569;
      --accent: #2563eb;
      --ring: rgba(37, 99, 235, 0.35);
      --shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top, rgba(37, 99, 235, 0.10), transparent 42%),
        linear-gradient(180deg, #eef4ff 0%, var(--bg) 45%, #eef2ff 100%);
      display: grid;
      place-items: center;
      padding: 24px;
    }
    .card {
      width: min(760px, 100%);
      min-height: min(70vh, 620px);
      background: rgba(255, 255, 255, 0.82);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(148, 163, 184, 0.24);
      border-radius: 32px;
      box-shadow: var(--shadow);
      display: grid;
      place-items: center;
      padding: 40px 24px;
      text-align: center;
      animation: floatIn 700ms ease-out both;
    }
    h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 6.5rem);
      line-height: 0.95;
      letter-spacing: -0.06em;
      color: var(--text);
      text-wrap: balance;
    }
    .dot {
      display: inline-block;
      width: 0.22em;
      height: 0.22em;
      border-radius: 999px;
      background: var(--accent);
      transform: translateY(-0.18em);
      box-shadow: 0 0 0 10px rgba(37, 99, 235, 0.10);
      animation: pulse 2.2s ease-in-out infinite;
    }
    p {
      margin: 18px 0 0;
      max-width: 34ch;
      color: var(--muted);
      font-size: 1.05rem;
      line-height: 1.6;
    }
    :focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 4px;
      border-radius: 10px;
      box-shadow: 0 0 0 6px var(--ring);
    }
    @keyframes floatIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes pulse {
      0%, 100% { transform: translateY(-0.18em) scale(1); }
      50% { transform: translateY(-0.18em) scale(1.08); }
    }
    @media (max-width: 480px) {
      body { padding: 16px; }
      .card { min-height: 72vh; border-radius: 24px; padding: 32px 18px; }
      p { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Hello World screen">
    <div>
      <h1>Hello, <span class="dot" aria-hidden="true"></span>World!</h1>
      <p>Single-screen static landing page.</p>
    </div>
  </main>
</body>
</html>
